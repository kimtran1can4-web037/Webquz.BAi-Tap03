<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizWave - Bài Kiểm Tra Trắc Nghiệm</title>
    <style>
        :root {
            --primary-color: #0077ff;
            --primary-dark: #0056b3;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-box h2 {
            font-size: 1.25rem;
            color: var(--text-color);
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #f0f4f8;
            border: 2px solid #e1e8ed;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover {
            background: #e3f2fd;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #2e7d32 !important;
            color: white !important;
            border-color: #2e7d32 !important;
        }

        .option-btn.wrong {
            background-color: #c62828 !important;
            color: white !important;
            border-color: #c62828 !important;
        }

        .footer {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress {
            font-size: 0.9rem;
            color: #777;
            font-weight: 600;
        }

        .next-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-dark);
        }

        .result-box h2 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .result-box p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .restart-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>QuizWave 🌊</h1>
            <p>Nền tảng kiểm tra kiến thức trực tuyến</p>
        </div>

        <div id="quiz-screen">
            <div class="question-box">
                <h2 id="question-text">Đang tải câu hỏi...</h2>
                <div class="options-grid" id="options-container"></div>
            </div>

            <div class="footer">
                <span class="progress" id="progress-text">Câu 1 / 3</span>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo</button>
            </div>
        </div>

        <div id="result-screen" style="display: none;" class="result-box">
            <h2>Hoàn thành! 🎉</h2>
            <p id="score-text">Bạn đạt 0/3 điểm.</p>
            <button class="restart-btn" onclick="restartQuiz()">Làm lại bài thi</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Thủ đô của Việt Nam là gì?",
                options: ["Hồ Chí Minh", "Hà Nội", "Đà Nẵng", "Cần Thơ"],
                answer: 1
            },
            {
                question: "Ngôn ngữ lập trình nào được sử dụng để tạo tương tác cho trang web?",
                options: ["Python", "C++", "JavaScript", "Java"],
                answer: 2
            },
            {
                question: "HTML là viết tắt của cụm từ nào?",
                options: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyper Transfer Markup Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressText = document.getElementById("progress-text");
        const nextBtn = document.getElementById("next-btn");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const scoreText = document.getElementById("score-text");

        function loadQuestion() {
            nextBtn.style.display = "none";
            const currentData = quizData[currentQuestionIndex];
            
            questionText.innerText = `Câu ${currentQuestionIndex + 1}: ${currentData.question}`;
            progressText.innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
            
            optionsContainer.innerHTML = "";
            currentData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(btn, index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedIndex) {
            const currentData = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.children;

            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (selectedIndex === currentData.answer) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allButtons[currentData.answer].classList.add("correct");
            }

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = "none";
            resultScreen.style.display = "block";
            scoreText.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu hỏi!`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = "none";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
